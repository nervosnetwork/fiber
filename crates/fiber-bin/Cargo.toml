[package]
name = "fiber-bin"
version = "0.10.0-rc1"
edition = "2021"
license.workspace = true

[[bin]]
name = "fnn"
path = "src/main.rs"

[features]
default = ["fnn/rocksdb", "watchtower", "lsp"]
debug-add-tlc = ["fnn/debug-add-tlc"]
metrics = ["fnn/metrics"]
sqlite = ["fnn/sqlite", "watchtower"]
lsp = ["fnn/lsp"]
watchtower = ["fnn/watchtower"]

[dependencies]
# Default features are switched off on purpose: a dependency's default features are
# enabled by Cargo regardless of this crate's `--no-default-features`, so leaving
# them on would make the `lsp` and `watchtower` features below one-way switches and
# no one could build a node without the hosted LSP. Every default of `fnn` must be
# mirrored as a feature here.
fnn = { path = "../fiber-lib", default-features = false }
ckb-chain-spec = "1"
ckb-resource = "1"
ractor = { version = "0.15", features = [
  "async-trait",
] }
jsonrpsee = { version = "0.25", features = ["http-client"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
fiber-store = { path = "../fiber-store", features = ["rocksdb"] }
tempfile = "3.10.1"
