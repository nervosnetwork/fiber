[package]
name = "fiber-store"
version = "0.9.1"
edition = "2021"
description = "Key-value store backends and migration framework for Fiber Network"
build = "build.rs"

[dependencies]
# Logging
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0.58"

# SQLite backend (optional)
rusqlite = { version = "0.34", features = ["bundled"], optional = true }

# Fiber types for migration
fiber-types-090 = { package = "fiber-types", version = "0.9.0-rc4", features = ["watchtower"] }
fiber-types-current = { package = "fiber-types", path = "../fiber-types" }

# Old fiber types for deserializing legacy data
fiber-types-081 = { package = "fiber-types", version = "0.8.1" }

# Serialization for migration data conversion
bincode = "1.3.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rocksdb = { package = "ckb-rocksdb", version = "=0.21.1", features = [
  "lz4",
], default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3.10.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
anyhow = "1.0.81"
console_error_panic_hook = "0.1.7"
fiber-wasm-db-common = { path = "../fiber-wasm-db-common" }
wasm-bindgen = "0.2.84"
web-sys = "0.3.72"

[dev-dependencies]
fiber-types-081 = { package = "fiber-types", version = "0.8.1", features = ["sample"] }
fiber-types-090 = { package = "fiber-types", version = "0.9.0-rc4", features = ["sample", "watchtower"] }
tempfile = "3.10.1"

[features]
default = []
portable = ["rocksdb/portable"]
browser-test = []
sqlite = ["dep:rusqlite"]

[lints.clippy]
expect-fun-call = "allow"
needless-return = "allow"
upper-case-acronyms = "allow"
