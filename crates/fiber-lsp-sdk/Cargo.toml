[package]
name = "fiber-lsp-sdk"
version = "0.1.0"
edition = "2021"
description = "Portable SDK for hosted Fiber LSP clients and remote channel signing"
license = "MIT"

[dependencies]
async-trait = "0.1"
bincode = "1.3.3"
ckb-types = "1"
ckb-jsonrpc-types = { version = "1", optional = true }
fiber-json-types = { path = "../fiber-json-types", optional = true, features = ["conversion", "watchtower"] }
fiber-types = { path = "../fiber-types", features = ["watchtower"] }
hex = "0.4"
getrandom = "0.3"
molecule = { version = "0.9.2", default-features = false }
musig2 = { version = "0.2.4", features = ["secp256k1", "serde"] }
secp256k1 = { version = "0.30.0", features = ["serde", "recovery", "global-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_with = "3.9"
thiserror = "1.0"
zeroize = "1.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["json"]
# JSON-RPC conversions for `get_channel_signing_status` / `submit_channel_signature`.
json = ["dep:fiber-json-types", "dep:ckb-jsonrpc-types"]
# Exposes `SigningPolicy::Always` for test fixtures.
test-apis = []

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[package.metadata.cargo-shear]
ignored = ["getrandom"]

[lints.clippy]
large-enum-variant = "allow"
