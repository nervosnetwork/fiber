[package]
name = "fiber-dst"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Deterministic simulation testing for the Fiber Network"
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
async-trait = "0.1"
biscuit-auth = "6.0.0-beta.3"
ckb-jsonrpc-types = "1"
ckb-sdk = "5"
ckb-types = "1"
fiber-json-types = { path = "../fiber-json-types", features = ["conversion", "watchtower"] }
fiber-lsp-sdk = { path = "../fiber-lsp-sdk", features = ["json", "simulation", "test-apis"] }
fiber-store = { path = "../fiber-store", features = ["sqlite", "simulation"] }
fnn = { path = "../fiber-lib", features = ["simulation", "sqlite", "lsp", "watchtower"] }
hex = "0.4"
hyper = "1.5"
jsonrpsee = { version = "0.25.1", features = ["client-core", "server", "macros"] }
rand = "0.9"
ractor = { version = "0.15", features = ["async-trait"] }
rusqlite = { version = "0.34", features = ["bundled"] }
secp256k1 = { version = "0.30", features = ["global-context", "recovery"] }
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turmoil = "=0.7.2"
