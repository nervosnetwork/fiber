on: [push, pull_request]

name: Test OpenRPC Spec generating
# Pinned to ubuntu-24.04 for the rocksdb/GCC 15 reason described in ci.yml.

jobs:
  generating:
    name: Generate OpenRPC Spec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dsherret/rust-toolchain-file@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: openrpc-${{ runner.os }}
      - run: |
          cd openrpc-json-generator
          cargo run --locked
