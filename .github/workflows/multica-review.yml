name: Multica review

# Active only after this file is on the default branch.
# issue_comment workflows run from the default branch, not from the PR head.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  repository_dispatch:
    types: [multica-review-result]

jobs:
  dispatch:
    # Skip unrelated comments before allocating a runner; the step checks the exact command.
    if: >-
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '/review') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Route comment to Multica
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_URL: ${{ secrets.MULTICA_REVIEW_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          SENDER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
        run: |
          python3 << 'PY'
          import json, os, re, sys, urllib.request
          import subprocess

          body = os.environ["COMMENT_BODY"] or ""
          if not re.match(r"^\s*/review(?:\s|$)", body):
              print("No /review command. Skipping.")
              sys.exit(0)

          number = os.environ["ISSUE_NUMBER"]
          repo = os.environ["REPO"]
          comment_id = int(os.environ["COMMENT_ID"])

          def github_post(path, field):
              subprocess.run(
                  ["gh", "api", "--method", "POST", f"repos/{repo}/{path}", "-f", field],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )

          is_pr = os.environ["IS_PULL_REQUEST"].lower() == "true"
          payload = {
              "event": "start",
              "repository": repo,
              "number": int(number),
              "is_pull_request": is_pr,
              "comment_id": comment_id,
              "comment_url": os.environ["COMMENT_URL"],
              "comment_body": body,
              "sender": os.environ["SENDER"],
              "instruction": (
                  "Start an English Multica convention review for this pull request. "
                  "Read the diff and the triggering comment."
              ),
          }

          webhook = os.environ.get("WEBHOOK_URL", "").strip()
          if not webhook:
              github_post(
                  f"issues/{number}/comments",
                  "body=Multica review was not sent. Add repository secret MULTICA_REVIEW_WEBHOOK_URL "
                  "(the Fiber Autopilot webhook URL), then comment /review again."
              )
              print("MULTICA_REVIEW_WEBHOOK_URL is not set.")
              sys.exit(1)

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Webhook status {response.status}")

          # PR conversation comments use the issues API; inline review comments use the pulls API.
          resource = "pulls" if os.environ["GITHUB_EVENT_NAME"] == "pull_request_review_comment" else "issues"
          github_post(f"{resource}/comments/{comment_id}/reactions", "content=eyes")
          PY

  reply:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment as github-actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.client_payload.number }}
          BODY: ${{ github.event.client_payload.body }}
        run: |
          python3 << 'PY'
          import os, subprocess, sys
          number = os.environ.get("NUMBER", "").strip()
          body = os.environ.get("BODY") or ""
          if not number or not body.strip():
              print("Missing number or body.")
              sys.exit(1)
          marker = "<!-- multica-review-result -->"
          if marker not in body:
              body = body.rstrip() + "\n\n" + marker + "\n"
          subprocess.run(
              ["gh", "api", f"repos/{os.environ['REPO']}/issues/{number}/comments", "-f", f"body={body}"],
              check=True,
          )
          PY
