name: Release
on:
  push:
    branches: [ 'playground/release' ]
    tags: [ '*' ]
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write
jobs:
  release-npm:
    name: Build & Release fiber-js
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v6
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
    - run: |
        npm ci --ignore-scripts
    - run: |
        npm run build -ws
    - name: Check if version exists
      run: |
        cd fiber-js
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        PACKAGE_VERSION=$(node -p "require('./package.json').version")

        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
          echo "Version $PACKAGE_VERSION already exists on NPM"
          echo "SHOULD_PUBLISH=false" >> $GITHUB_ENV
        else
          echo "Version $PACKAGE_VERSION does not exist, proceeding with publish"
          echo "SHOULD_PUBLISH=true" >> $GITHUB_ENV
        fi
    - name: Publish to NPM
      if: env.SHOULD_PUBLISH == 'true'
      run: |
        cd fiber-js
        npm publish --provenance --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-2022 ]
        include:
          - os: ubuntu-22.04
            bin_suffix:
            pkg_suffix: x86_64-linux-portable
          - os: ubuntu-24.04
            bin_suffix:
            pkg_suffix: x86_64-linux
          - os: ubuntu-22.04-arm
            bin_suffix:
            pkg_suffix: aarch64-linux-portable
          - os: macos-15
            bin_suffix:
            pkg_suffix: aarch64-darwin-portable
          - os: macos-15-intel
            bin_suffix:
            pkg_suffix: x86_64-darwin-portable
          - os: windows-2022
            bin_suffix: .exe
            pkg_suffix: x86_64-windows
    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v6
    - if: matrix.os == 'windows-2022'
      name: Windows Dependencies
      run: |
        iwr -useb get.scoop.sh -outfile 'install-scoop.ps1'
        .\install-scoop.ps1 -RunAsAdmin
        echo "LIBCLANG_PATH=$($HOME)/scoop/apps/llvm/current/bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        scoop install llvm yasm
        vcpkg integrate install
        vcpkg install openssl:x64-windows-static-md
    - if: matrix.os == 'ubuntu-22.04'
      name: Build linux portable
      run: |
        export PWD_DIR=$(pwd)
        curl -LO https://www.openssl.org/source/openssl-1.1.1s.tar.gz
        tar -xzf openssl-1.1.1s.tar.gz
        cd openssl-1.1.1s
        ./Configure linux-x86_64 shared
        make
        cd ..
        export OPENSSL_LIB_DIR=${PWD_DIR}/openssl-1.1.1s
        export OPENSSL_INCLUDE_DIR=${PWD_DIR}/openssl-1.1.1s/include
        export OPENSSL_STATIC=1
        cargo build --release --locked --features portable
    - if: matrix.os == 'ubuntu-22.04-arm'
      name: Build aarch64 linux portable
      run: |
        export PWD_DIR=$(pwd)
        curl -LO https://www.openssl.org/source/openssl-1.1.1s.tar.gz
        tar -xzf openssl-1.1.1s.tar.gz
        cd openssl-1.1.1s
        ./Configure linux-aarch64 shared
        make
        cd ..
        export OPENSSL_LIB_DIR=${PWD_DIR}/openssl-1.1.1s
        export OPENSSL_INCLUDE_DIR=${PWD_DIR}/openssl-1.1.1s/include
        export OPENSSL_STATIC=1
        cargo build --release --locked --features portable
    - if: matrix.os == 'ubuntu-24.04'
      name: Build linux
      run: cargo build --release --locked
    - if: startsWith(matrix.os, 'macos-15')
      name: Build macos portable
      run: cargo build --release --locked --features portable
    - if: matrix.os == 'windows-2022'
      name: Build windows
      run: cargo build --release --locked
    - name: Get the Version
      id: get_version
      shell: bash
      run: echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3)" >> $GITHUB_OUTPUT
    - id: get_package
      name: Package
      shell: bash
      run: |
        pkgname="fnn_${{ steps.get_version.outputs.VERSION }}-${{ matrix.pkg_suffix }}.tar.gz"
        cp "target/release/fnn${{ matrix.bin_suffix }}" "fnn${{ matrix.bin_suffix }}"
        cp "target/release/fnn-cli${{ matrix.bin_suffix }}" "fnn-cli${{ matrix.bin_suffix }}"
        tar czvf "${pkgname}" "fnn${{ matrix.bin_suffix }}" "fnn-cli${{ matrix.bin_suffix }}" "config"
        echo "PKGNAME=${pkgname}" >> $GITHUB_OUTPUT
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        files: |
          ${{ steps.get_package.outputs.PKGNAME }}
  release-docker-build:
    name: Build & Publish Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            os: ubuntu-22.04-arm
    steps:
    - name: Checkout the Repository
      uses: actions/checkout@v6
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository }}
          nervos/fiber
        flavor: |
          # Keep auto latest disabled; the explicit latest tag below is only for stable releases.
          latest=false
        tags: |
          type=raw,value=edge-${{ matrix.arch }},enable=${{ github.ref == 'refs/heads/playground/release' }}
          type=semver,pattern={{version}},suffix=-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          type=semver,pattern={{major}},suffix=-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          type=raw,value=latest-${{ matrix.arch }},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          type=sha,format=short,suffix=-${{ matrix.arch }}
    - name: Build and Push Docker Images
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: ${{ matrix.platform }}
        push: true
        provenance: true
        sbom: true
        cache-from: type=gha,scope=docker-${{ matrix.arch }}
        cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.meta.outputs.tags }}
  release-docker-manifest:
    name: Publish Docker Manifests
    runs-on: ubuntu-24.04
    needs: release-docker-build
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository }}
          nervos/fiber
        flavor: |
          # Keep auto latest disabled; the explicit latest tag below is only for stable releases.
          latest=false
        tags: |
          type=raw,value=edge,enable=${{ github.ref == 'refs/heads/playground/release' }}
          type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          type=sha,format=short
    - name: Create and Push Docker Manifests
      shell: bash
      env:
        DOCKER_TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        while IFS= read -r tag; do
          if [[ -z "$tag" ]]; then
            continue
          fi

          docker buildx imagetools create \
            --tag "$tag" \
            "${tag}-amd64" \
            "${tag}-arm64"
        done <<< "$DOCKER_TAGS"
  publish-crates:
    name: Publish fiber-types and fiber-json-types to crates.io
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish fiber-types
        run: cargo publish -p fiber-types
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish fiber-json-types (retry until index updated)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for i in $(seq 1 10); do
            if cargo publish -p fiber-json-types 2>&1; then
              echo "fiber-json-types published successfully"
              exit 0
            fi
            echo "Attempt $i/10 failed, retrying in 30s..."
            sleep 30
          done
          echo "Failed to publish fiber-json-types after 10 attempts"
          exit 1
